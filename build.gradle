plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.7-SNAPSHOT" apply false
    id "org.jetbrains.kotlin.jvm" version "1.9.10" apply false
    id 'com.matthewprenger.cursegradle' version '1.4.0' apply false
    id "com.modrinth.minotaur" version "2.4.5" apply false
    id "io.github.pacifistmc.forgix" version "1.2.9"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "org.jetbrains.kotlin.jvm"

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.realrobotix.me/master/" ; content { includeGroup("com.rbasamoyai") } }
        maven { name = "ParchmentMC"; url = "https://maven.parchmentmc.org" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://api.modrinth.com/maven"; content { includeGroup("maven.modrinth") } }
        maven { url = "https://cursemaven.com"; content { includeGroup "curse.maven" } }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://mvn.devos.one/snapshots/" }
        maven { url = "https://maven.cafeteria.dev/releases" }
        maven { url = "https://jitpack.io" }
        maven { url = "https://maven.fallenbreath.me/releases"; content { includeGroup "me.fallenbreath" } }
        maven { name = "createmod maven"; url = "https://maven.createmod.net/" }
        maven { name = "Valkyrien Skies"; url = "https://maven.valkyrienskies.org" }
        maven { url = "https://modmaven.dev" }
        maven { url = "https://maven.tterrag.com" }
        mavenLocal()
        maven { name = 'Kotlin for Forge'; url = 'https://thedarkcolour.github.io/KotlinForForge/'; content { includeGroup "thedarkcolour" } }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:2023.09.03@zip")
        }
        implementation("org.joml:joml:1.10.4") { transitive = false }
        implementation("org.joml:joml-primitives:1.10.0") { transitive = false }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.version
    group = rootProject.maven_group
}

tasks.named("build") {
    finalizedBy("mergeJars")
}
String gitRevision = "git rev-parse HEAD".execute().text.trim()
version = "${minecraft_version}-${mod_version}+${gitRevision.substring(0, 10)}"
forgix {
    group = "io.github.xiewuzhiying.vs_addition"
    mergedJarName = "vs_addition-${version}.jar"
    outputDir = "build/libs/merged"

    forge {
        projectName = "forge"
        jarLocation = "build/libs/vs_addition-${minecraft_version}-forge-${mod_version}+${gitRevision.substring(0, 10)}.jar"
    }

    fabric {
        projectName = "fabric"
        jarLocation = "build/libs/vs_addition-${minecraft_version}-fabric-${mod_version}+${gitRevision.substring(0, 10)}.jar"
    }
}
